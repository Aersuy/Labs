; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; env:native exista doar pentru `pio test -e native`: nu are main() in afara
; suitelor, deci nu trebuie sa intre in `pio run`.
[platformio]
default_envs = megaatmega1280

[env:megaatmega1280]
platform = atmelavr
board = megaatmega1280
framework = arduino
lib_deps = feilipu/FreeRTOS@^11.1.0-3

; rtosUartStdioInit() is called with 9600 below; the monitor has to agree or
; the log is garbage.
monitor_speed = 9600
; Suitele Unity ruleaza cu main() propriu, deci nu se pot lega de nucleul
; Arduino, care isi defineste si el main(). Consecinta: `pio test` fara -e
; raporteaza "0 test cases" si iese cu succes - nu e o trecere, e o lipsa.
; Comanda corecta pentru teste este `pio test -e native`.
test_ignore = *

; Testele unitare ruleaza pe calculator, nu pe placa: ledFsm si
; pressClassifier sunt pure tocmai pentru asta. Celelalte module din src au
; nevoie de Arduino.h, deci filtrul le scoate din compilare.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<ledFsm.cpp> +<pressClassifier.cpp>
build_flags = -std=c++11 -Wall -I src
