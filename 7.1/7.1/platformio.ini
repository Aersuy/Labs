; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Lab 7.1 are doua microcontrolere in acelasi proiect: mainSlave.cpp si
; mainMaster.cpp sunt doua programe diferite, separate prin build_src_filter.
; Incarcarea se face pe rand, cu portul plasei dorite:
;   pio run -e slave  -t upload --upload-port COM3
;   pio run -e master -t upload --upload-port COM4
; env:native exista doar pentru `pio test -e native`: nu are main() in afara
; suitelor, deci nu trebuie sa intre in `pio run`.
[platformio]
default_envs = slave, master

; Slave-ul este cazul strans la RAM (ATmega328P, 2 KB): pe el stau cei doi
; senzori, biblioteca Wire in mod sclav si tamponul partajat. De aceea
; formatele printf stau in flash (printf_P/PSTR) si stivele sunt mici.
[env:slave]
platform = atmelavr
board = uno
framework = arduino
lib_deps = feilipu/FreeRTOS@^11.1.0-3
build_src_filter = +<*> -<mainMaster.cpp> -<i2cMasterLink.cpp>

; Wire in mod sclav isi adauga tampoanele proprii, iar jurnalul nu are nevoie
; de tamponul serial implicit (64+64 octeti): nimic nu citeste de la
; tastatura, iar scrierea merge octet cu octet.
build_flags =
  -DSERIAL_TX_BUFFER_SIZE=32
  -DSERIAL_RX_BUFFER_SIZE=16

; uartStdioInit() este apelat cu 9600 in ambele programe; monitorul trebuie
; sa fie de acord, altfel jurnalul este gunoi.
monitor_speed = 9600
; Suitele Unity ruleaza cu main() propriu, deci nu se pot lega de nucleul
; Arduino, care isi defineste si el main(). Consecinta: `pio test` fara -e
; raporteaza "0 test cases" si iese cu succes - nu e o trecere, e o lipsa.
; Comanda corecta pentru teste este `pio test -e native`.
test_ignore = *

; Masterul doar interogheaza si afiseaza, deci nu compileaza nici driverul de
; senzor, nici tamponul partajat cu ISR-ul TWI.
[env:master]
platform = atmelavr
board = megaatmega1280
framework = arduino
lib_deps = feilipu/FreeRTOS@^11.1.0-3
build_src_filter = +<*> -<mainSlave.cpp> -<i2cSlaveLink.cpp> -<hcsr04.cpp> -<distanceBuffer.cpp>
monitor_speed = 9600
test_ignore = *

; Testele unitare ruleaza pe calculator, nu pe placa: codecul de cadru,
; conversia ecoului si ambalarea datelor sunt pure tocmai pentru asta.
; Celelalte module din src au nevoie de Arduino.h sau de FreeRTOS, deci
; filtrul le scoate din compilare.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<frameCodec.cpp> +<echoDistance.cpp> +<distancePayload.cpp>
build_flags = -std=c++11 -Wall -I src
