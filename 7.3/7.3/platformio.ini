; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Lab 7.3 are doua microcontrolere in acelasi proiect: mainNode.cpp (Arduino
; Uno) si mainGateway.cpp (ESP32) sunt doua programe diferite, separate prin
; build_src_filter. Incarcarea se face pe rand, cu portul placii dorite:
;   pio run -e node    -t upload --upload-port COM3
;   pio run -e gateway -t upload --upload-port COM4
;
; Numele vin de la rolurile din lab, nu de la protocol: pe fir legatura este in
; continuare master -> sclav din 7.2 (gateway-ul intreaba, nodul raspunde), dar
; masterul are acum o a doua sarcina - puntea catre MQTT - iar numele o spune.
;
; env:native exista doar pentru `pio test -e native`: nu are main() in afara
; suitelor, deci nu trebuie sa intre in `pio run`.
[platformio]
default_envs = node, gateway

; Nodul este cazul strans la RAM (ATmega328P, 2 KB): pe el stau senzorul,
; LED-ul, FIFO-ul de cereri si urmarirea SEQ. Nimic din WiFi, MQTT sau JSON nu
; ajunge aici - acela este rostul punctii pe ESP32. De aceea formatele printf
; stau in flash (printf_P/PSTR) si stivele sunt mici.
;
; Nodul se poate muta pe Mega schimband doua linii: board = megaatmega1280 si
; serialLinkSoftware.cpp -> serialLinkHardware.cpp in filtru (atunci legatura
; trece pe USART1, RX1 D19 / TX1 D18, cu receptie pe intrerupere).
[env:node]
platform = atmelavr
board = uno
framework = arduino
lib_deps = feilipu/FreeRTOS@^11.1.0-3
build_src_filter = +<*> -<mainGateway.cpp> -<serialLinkHardware.cpp> -<serialLinkEsp32.cpp>
  -<wifiLink.cpp> -<mqttSession.cpp> -<telemetryJson.cpp> -<rpcCommand.cpp>
  -<rpcResponse.cpp> -<mqttBackoff.cpp> -<requestBuilder.cpp>

; SoftwareSerial isi ia deja tamponul propriu de receptie: jurnalul nu are
; nevoie de tamponul serial implicit (64+64 octeti), nimic nu citeste de la
; tastatura, iar scrierea merge octet cu octet.
build_flags =
  -DSERIAL_TX_BUFFER_SIZE=32
  -DSERIAL_RX_BUFFER_SIZE=16

; uartStdioInit() este apelat cu 9600; monitorul trebuie sa fie de acord,
; altfel jurnalul este gunoi.
monitor_speed = 9600
; Suitele Unity ruleaza cu main() propriu, deci nu se pot lega de nucleul
; Arduino, care isi defineste si el main(). Consecinta: `pio test` fara -e
; raporteaza "0 test cases" si iese cu succes - nu e o trecere, e o lipsa.
; Comanda corecta pentru teste este `pio test -e native`.
test_ignore = *

; Puntea: ESP32 vorbeste protocolul binar din 7.2 pe Serial2 si MQTT pe WiFi.
; Nu compileaza nici senzorul, nici LED-ul, nici constructorul de raspunsuri -
; acelea sunt ale nodului. uartStdio.cpp ramane in afara pentru ca foloseste
; fluxurile FILE din avr-libc, care nu exista pe ESP32: aici jurnalul merge
; direct prin Serial.printf.
[env:gateway]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2
build_src_filter = +<*> -<mainNode.cpp> -<serialLinkSoftware.cpp> -<serialLinkHardware.cpp>
  -<uartStdio.cpp> -<responseBuilder.cpp> -<sequenceTracker.cpp> -<ky013.cpp> -<ledClass.cpp>
monitor_speed = 115200
test_ignore = *

; Testele unitare ruleaza pe calculator, nu pe placa: codecul de cadru,
; analizorul de flux, ambalarea PAYLOAD-ului, urmarirea SEQ, constructorii de
; pachete, formatarea telemetriei, analiza cererilor RPC si politica de
; reconectare sunt pure tocmai pentru asta. Celelalte module din src au nevoie
; de Arduino.h, de FreeRTOS sau de retea, deci filtrul le scoate din compilare.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<packetCodec.cpp> +<packetParser.cpp> +<packetPayload.cpp>
  +<sequenceTracker.cpp> +<responseBuilder.cpp> +<requestBuilder.cpp> +<deciTemperature.cpp>
  +<telemetryJson.cpp> +<rpcCommand.cpp> +<rpcResponse.cpp> +<mqttBackoff.cpp>
lib_deps = bblanchon/ArduinoJson@^7.2
; ArduinoJson 7 cere cel putin C++11, dar se construieste curat abia pe C++17
; (foloseste if constexpr in cateva locuri); env-ul acesta nu atinge placile.
build_flags = -std=c++17 -Wall -I src
