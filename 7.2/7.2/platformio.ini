; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Lab 7.2 are doua microcontrolere in acelasi proiect: mainMaster.cpp si
; mainSlave.cpp sunt doua programe diferite, separate prin build_src_filter.
; Incarcarea se face pe rand, cu portul placii dorite:
;   pio run -e slave  -t upload --upload-port COM3
;   pio run -e master -t upload --upload-port COM4
; env:native exista doar pentru `pio test -e native`: nu are main() in afara
; suitelor, deci nu trebuie sa intre in `pio run`.
[platformio]
default_envs = slave, master

; Sclavul sta pe Mega pentru ca el duce FIFO-ul, analizorul si contoarele, iar
; legatura dintre placi ii cade pe USART1 (hardware, receptie pe intrerupere cu
; tampon de 64 de octeti): partea care nu are voie sa piarda octeti.
; STDIO ramane pe Serial0 (USB), deci protocolul si jurnalul nu se amesteca.
[env:slave]
platform = atmelavr
board = megaatmega1280
framework = arduino
lib_deps = feilipu/FreeRTOS@^11.1.0-3
build_src_filter = +<*> -<mainMaster.cpp> -<serialLinkSoftware.cpp> -<requestBuilder.cpp>
monitor_speed = 9600
; Suitele Unity ruleaza cu main() propriu, deci nu se pot lega de nucleul
; Arduino, care isi defineste si el main(). Consecinta: `pio test` fara -e
; raporteaza "0 test cases" si iese cu succes - nu e o trecere, e o lipsa.
; Comanda corecta pentru teste este `pio test -e native`.
test_ignore = *

; Masterul sta pe Uno: are un singur USART, ocupat de STDIO, deci legatura
; dedicata este SoftwareSerial pe D10/D11. El nu compileaza nici senzorul, nici
; LED-ul, nici urmarirea SEQ - acelea sunt ale sclavului.
[env:master]
platform = atmelavr
board = uno
framework = arduino
lib_deps = feilipu/FreeRTOS@^11.1.0-3
build_src_filter = +<*> -<mainSlave.cpp> -<serialLinkHardware.cpp> -<responseBuilder.cpp>
  -<sequenceTracker.cpp> -<ky013.cpp> -<ledClass.cpp>

; ATmega328P are 2 KB de RAM, iar SoftwareSerial isi ia deja tamponul propriu
; de receptie: jurnalul nu are nevoie de tamponul serial implicit (64+64
; octeti), nimic nu citeste de la tastatura, iar scrierea merge octet cu octet.
build_flags =
  -DSERIAL_TX_BUFFER_SIZE=32
  -DSERIAL_RX_BUFFER_SIZE=16

; uartStdioInit() este apelat cu 9600 in ambele programe; monitorul trebuie sa
; fie de acord, altfel jurnalul este gunoi.
monitor_speed = 9600
test_ignore = *

; Testele unitare ruleaza pe calculator, nu pe placa: codecul, analizorul de
; flux, ambalarea PAYLOAD-ului, urmarirea SEQ si constructorii de pachete sunt
; pure tocmai pentru asta. Celelalte module din src au nevoie de Arduino.h sau
; de FreeRTOS, deci filtrul le scoate din compilare.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<packetCodec.cpp> +<packetParser.cpp> +<packetPayload.cpp>
  +<sequenceTracker.cpp> +<responseBuilder.cpp> +<requestBuilder.cpp>
build_flags = -std=c++11 -Wall -I src
